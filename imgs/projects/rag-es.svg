<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Cómo responde UAM RAG Agent</title><desc id="desc">La pregunta se convierte en un vector, MongoDB recupera diez fragmentos de los materiales del máster y Groq genera una respuesta con ese contexto.</desc>
<rect width="1200" height="675" fill="#e9eeeb"/>
<g font-family="Arial,sans-serif" fill="#213e3a"><text x="72" y="86" font-size="18" letter-spacing="3">UAM RAG AGENT</text><text x="72" y="148" font-size="43">Una pregunta. El contexto del máster.</text><text x="72" y="190" font-size="20" fill="#536961">Esquema de funcionamiento · no es una captura de la aplicación</text></g>
<g fill="#fff"><rect x="72" y="260" width="290" height="215" rx="6"/><rect x="455" y="260" width="290" height="215" rx="6"/><rect x="838" y="260" width="290" height="215" rx="6"/></g>
<g stroke="#55766b" stroke-width="2" fill="none"><path d="M362 370h88m-13-9 13 9-13 9M745 370h88m-13-9 13 9-13 9"/></g>
<g font-family="Arial,sans-serif" fill="#213e3a"><text x="100" y="309" font-size="16">01 / PREGUNTA</text><text x="100" y="365" font-size="27">Texto → vector</text><text x="100" y="411" font-size="18" fill="#536961">Hugging Face · LlamaIndex</text><text x="483" y="309" font-size="16">02 / BÚSQUEDA</text><text x="483" y="365" font-size="27">10 fragmentos</text><text x="483" y="411" font-size="18" fill="#536961">MongoDB · búsqueda vectorial</text><text x="866" y="309" font-size="16">03 / RESPUESTA</text><text x="866" y="365" font-size="27">Texto + contexto</text><text x="866" y="411" font-size="18" fill="#536961">Groq · respuesta en streaming</text><text x="72" y="565" font-size="20">La recuperación selecciona el material que recibe el modelo.</text><text x="72" y="603" font-size="17" fill="#536961">Interfaz en Streamlit · proyecto de fin de máster</text></g>
</svg>
